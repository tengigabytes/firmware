[env:rp2350b-mokya]
extends = rp2350_base
board = rpipico2
board_level = alpha
upload_protocol = jlink

extra_scripts =
  ${env.extra_scripts}
  pre:variants/rp2350/rp2350b-mokya/patch_arduinopico.py
  pre:variants/rp2350/rp2350b-mokya/wire_shared_ipc.py

build_flags =
  ${rp2350_base.build_flags}
  -D RPI_PICO2
  -I variants/rp2350/rp2350b-mokya
  -D HW_SPI1_DEVICE
  ; --- Phase 2 M1.0 spike ---
  ; Disable Arduino-Pico built-in SerialUSB; Core 1 will own USB and Core 0
  ; reaches the host through IpcSerialStream (shared SRAM SPSC ring).
  ; Requires patch_arduinopico.py pre-script to guard the extern
  ; `SerialUSB Serial;` declaration in SerialUSB.h.
  -D NO_USB
  ; --- Phase 2 M1.0 spike: single-core FreeRTOS ---
  ; rp2350_base enables -D__FREERTOS=1 which pulls in FreeRTOS SMP with
  ; configNUMBER_OF_CORES=2. SMP launches a passive-idle task on Core 1 at
  ; scheduler start (via multicore_launch_core1 -> xPortStartSchedulerOnCore
  ; -> vStartFirstTask), which HardFaults before any user code runs.
  ; MokyaLora plan has Core 1 owned by a *separate* Apache-2.0 image (M1.0b
  ; onwards), so Core 0's FreeRTOS must stay on Core 0 only.
  -D configNUMBER_OF_CORES=1
  -D configUSE_CORE_AFFINITY=0
  -D configRUN_MULTIPLE_PRIORITIES=0
  -D configUSE_PASSIVE_IDLE_HOOK=0
  -D configUSE_TASK_PREEMPTION_DISABLE=0
  ; --- Minimal LoRa-only build for MokyaLora Core 0 ---
  ; Disable all hardware not present / not managed by this core
  ; M3.5: GPS is enabled — Core 1 owns the Teseo and writes NMEA into
  ; IpcGpsBuf in shared SRAM; Core 0 reads through IpcGpsStream (a Stream
  ; adapter) instead of a UART. See variants/.../ipc_gps_stream.{h,cpp}.
  -D HAS_GPS=1
  -D MOKYA_IPC_GPS_STREAM=1
  -D GPS_RX_PIN=99
  -D MESHTASTIC_EXCLUDE_SCREEN=1
  -D MESHTASTIC_EXCLUDE_WIFI=1
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1
  -D MESHTASTIC_EXCLUDE_I2C=1
  -D MESHTASTIC_EXCLUDE_MQTT=1
  -D MESHTASTIC_EXCLUDE_POWERMON=1
  -D MESHTASTIC_EXCLUDE_POWER_FSM=1
  -D MESHTASTIC_EXCLUDE_TZ=1
  ; Disable optional modules not needed for pure LoRa modem
  -D MESHTASTIC_EXCLUDE_AUDIO=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -D MESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_RANGETEST=1
  -D MESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
  -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
  -D MESHTASTIC_EXCLUDE_ATAK=1
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
  -D MESHTASTIC_EXCLUDE_SERIAL=1
  -D MESHTASTIC_EXCLUDE_POWERSTRESS=1
  ; KEEP: Admin (serial config), TextMessage, PKI, Traceroute, NeighborInfo, Waypoint
  ; --- Phase 2 M2: flash write safety (P2-11 fix) ---
  ; Wrap Pico SDK flash functions so we can park Core 1 and disable
  ; interrupts before XIP is turned off. See flash_safety_wrap.c.
  -Wl,--wrap=flash_range_erase
  -Wl,--wrap=flash_range_program
  ; --- POC: Core-0-only selective reset (RETIRED 2026-04-26) ---
  ; The mechanism does isolate proc0's reset domain (PSM_FRCE_OFF.PROC1=0
  ; verified post-trigger), but RP2350 bootrom unconditionally calls
  ; multicore_reset_core1 on every proc0 cold-boot — Core 1 ends up in
  ; bootrom mailbox FIFO handler. Selective reset infeasible at HW level.
  ; Pivoted to soft reset via Meshtastic's existing service->reloadConfig().
  ; poc_c0_reset.cpp + variant.cpp warm-boot detect kept as documentation.
  ; -D MOKYA_POC_C0_RESET=1

build_src_filter =
  ${rp2350_base.build_src_filter}
  +<../variants/rp2350/rp2350b-mokya/ipc_serial_stub.cpp>
  +<../variants/rp2350/rp2350b-mokya/variant.cpp>
  +<../variants/rp2350/rp2350b-mokya/flash_safety_wrap.c>
  +<../variants/rp2350/rp2350b-mokya/flash_park_listener.c>
  +<../variants/rp2350/rp2350b-mokya/ipc_gps_stream.cpp>
  +<../variants/rp2350/rp2350b-mokya/ipc_text_observer.cpp>
  +<../variants/rp2350/rp2350b-mokya/ipc_command_handler.cpp>
  +<../variants/rp2350/rp2350b-mokya/ipc_ack_observer.cpp>
  +<../variants/rp2350/rp2350b-mokya/ipc_node_observer.cpp>
  +<../variants/rp2350/rp2350b-mokya/poc_c0_reset.cpp>
  +<../variants/rp2350/rp2350b-mokya/ipc_config_handler.cpp>
  +<../variants/rp2350/rp2350b-mokya/postmortem.cpp>

; Override lib_deps to drop environmental_base / environmental_extra — those
; pull in a pile of Adafruit sensor drivers whose .cpp files reference the
; framework `Serial` global unconditionally. With -DNO_USB that symbol is
; gone from Arduino.h, and injecting our IpcSerialStream stub via variant.h
; only reaches Meshtastic TUs, not the third-party lib TUs. Core 0 doesn't
; use any of these sensors anyway (MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR /
; _AIR_QUALITY_SENSOR / _I2C are all set), so it's safe to drop them.
lib_deps =
  ${arduino_base.lib_deps}
  ${radiolib_base.lib_deps}
  rweather/Crypto@0.4.0

; SdFat is bundled with framework-arduinopico and its header-inline ls()
; methods reference the Arduino `Serial` global unconditionally, so any TU
; that pulls in <SdFat.h> fails under -DNO_USB. Core 0 has no SD card
; (HAS_SDCARD is never defined), but PIO's LDF still scans FSCommon.cpp's
; `#include <SD.h>` and drags SdFat into the build. Ignore it explicitly.
lib_ignore =
  BluetoothOTA
  lvgl
  SdFat
  SD

debug_build_flags = ${rp2350_base.build_flags}, -g
debug_tool = jlink
